<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> portfolio fukleo17 </title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.85);
      transition: transform 1.5s ease;
    }

    .video-wrapper:hover video {
      transform: scale(1.05);
    }

    .title {
      position: absolute;
      bottom: 40px;
      left: 40px;
      font-size: 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
      z-index: 10;
    }

    /* YouTube videos section */
    section.youtube-section {
      padding: 20px 0;
      display: flex;
      justify-content: center;
      background: #000;
    }

    .youtube-playlist-wrapper {
      width: 80%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
    }

    .youtube-playlist-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Social Footer - Bottom Center */
    .social-footer {
      width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 70px 20px 72px;
      background: #000;
      text-align: center;
    }

    .social-footer-text {
      text-align: center;
    }

    .social-footer-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    .social-footer-services {
      color: #fff;
      font-size: 12px;
      letter-spacing: 1.5px;
      line-height: 1.8;
      opacity: 0.9;
    }

    .social-footer-divider {
      width: 1px;
      height: 54px;
      background: #fff;
      opacity: 0.65;
      margin: 42px 0 34px;
    }

    .social-footer-contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .social-footer-subtitle {
      font-size: 13px;
      letter-spacing: 2px;
      opacity: 0.7;
      margin: 0 0 14px;
    }

    .social-overlay a {
      display: inline-flex;
      align-items: center;
      color: #b22222;
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .social-overlay a:hover {
      opacity: 1;
      transform: scale(1.06);
    }

    .social-overlay .icon {
      width: 24px;
      height: 24px;
      stroke: #b22222;
      fill: none;
      margin-right: 6px;
    }

    .social-overlay .email-text {
      cursor: pointer;
    }

    /* Logo overlay */
    .logo-overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10000;
      display: block;
    }
    .logo-overlay img {
      height: 120px;
      width: auto;
      display: block;
    }

    /* Local Videos Section */
    section.local-videos-section {
      height: auto;
      min-height: 0;
      display: flex;
      flex-wrap: wrap;
      width: 100%;
      box-sizing: border-box;
      background: #000;
      overflow-x: hidden;
      gap: 24px;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0 auto;
    }

    .local-video-wrapper {
      flex: 0 1 calc(50% - 12px);
      width: calc(50% - 12px);
      box-sizing: border-box;
      background: #000;
      overflow: hidden;
      position: relative;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .local-video-wrapper.grxmtheshit {
      height: calc(48vw * 0.727);
    }

    .local-video-wrapper.yazyenkilla {
      height: calc(48vw * 0.5625);
    }

    .local-video-wrapper.sidevideo {
      height: calc(48vw * 0.5625);
    }

    .local-video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      transition: transform 1.5s ease;
      display: block;
    }

    .local-video-wrapper:hover video {
      transform: scale(1.05);
    }

    /* Fullscreen Video Section (Saintmalayan) */
    section.new-video-section {
      position: relative;
      height: 100vh;
      padding: 0 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    section.new-video-section video {
      width: auto;
      max-width: 100%;
      height: 100%;
      max-height: 100vh;
      object-fit: contain;
      filter: brightness(0.85);
      transition: transform 1.5s ease;
      display: block;
    }

    section.new-video-section:hover video {
      transform: scale(1.05);
    }

    section.new-video-section .title {
      position: absolute;
      bottom: 40px;
      left: 40px;
      font-size: 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
      z-index: 10;
    }

    @media (max-width: 768px) {
      /* =========================================================
         MOBILE ONLY
         Desktop layout above is intentionally untouched.
         All mobile video sections now size from the video's
         natural aspect ratio, so there are no artificial
         100vh / fixed-height black gaps.
         ========================================================= */

      section {
        height: auto;
        min-height: 0;
      }

      /* First 2 videos — same mobile scale/frame as the lower portfolio videos */
      .intro-video-section {
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        box-sizing: border-box;
        display: flex !important;
        justify-content: center !important;
        align-items: flex-start !important;
      }

      .intro-video-section .video-wrapper {
        position: relative;
        flex: 0 0 auto;
        width: 92% !important;
        max-width: 92% !important;
        height: calc(92vw * 0.5625) !important;
        min-height: 0 !important;
        margin: 0 auto !important;
        padding: 0 !important;
        box-sizing: border-box;
        overflow: hidden !important;
        background: #000;
        line-height: 0;
      }

      .intro-video-section .video-wrapper video {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        min-height: 0 !important;
        object-fit: contain !important;
        object-position: center center !important;
      }


/* Local video groups — one video per row, centered */
      section.local-videos-section {
        width: 100%;
        height: auto;
        min-height: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        justify-content: flex-start;
        align-items: center;
        gap: 8px;
        padding: 0;
        margin: 0;
        overflow: visible;
      }

      .local-video-wrapper,
      .local-video-wrapper.grxmtheshit,
      .local-video-wrapper.yazyenkilla,
      .local-video-wrapper.sidevideo {
        flex: 0 0 auto;
        width: 92% !important;
        height: auto !important;
        min-height: 0;
        aspect-ratio: auto !important;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        display: block;
        overflow: hidden;
      }

      .local-video-wrapper video {
        width: 100%;
        height: auto;
        min-height: 0;
        object-fit: contain;
        display: block;
        background: #000;
      }

      /* Saintmalayan — same natural-size behavior on mobile */
      section.new-video-section {
        width: 100%;
        height: auto;
        min-height: 0;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: visible;
      }

      section.new-video-section video {
        width: 92%;
        height: auto;
        max-width: 92%;
        max-height: none;
        object-fit: contain;
        display: block;
      }

      /* Keep the existing mobile footer sizing */
      .social-footer {
        padding: 52px 16px 56px;
      }

      .social-footer-title {
        font-size: 17px;
        letter-spacing: 1.5px;
      }

      .social-footer-services {
        font-size: 10px;
        letter-spacing: 1px;
        line-height: 1.7;
      }

      .social-footer-divider {
        height: 42px;
        margin: 32px 0 26px;
      }

      .social-footer-subtitle {
        font-size: 11px;
        letter-spacing: 1.3px;
        margin-bottom: 12px;
      }

      .social-overlay {
        font-size: 16px;
        gap: 20px;
      }

      .logo-overlay {
        top: 12px;
        left: 12px;
      }

      .logo-overlay img {
        height: 96px;
      }

      .youtube-playlist-wrapper {
        width: 95%;
        aspect-ratio: 16 / 9;
      }
    }
  </style>

  <script>
    const lenis = new Lenis({
      duration: 1.2,
      smooth: true,
      smoothTouch: false
    });
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    gsap.registerPlugin(ScrollTrigger);
    document.querySelectorAll('[data-animate]').forEach(section => {
      gsap.from(section, {
        opacity: 0,
        y: 50,
        duration: 1,
        scrollTrigger: {
          trigger: section,
          start: 'top 80%',
          toggleActions: 'play none none reverse'
        }
      });
    });
  </script>
