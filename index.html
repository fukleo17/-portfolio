<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> portfolio fukleo17 </title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.85);
      transition: transform 1.5s ease;
    }

    .video-wrapper:hover video {
      transform: scale(1.05);
    }

    .title {
      position: absolute;
      bottom: 40px;
      left: 40px;
      font-size: 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
      z-index: 10;
    }

    /* YouTube videos section */
    section.youtube-section {
      padding: 20px 0;
      display: flex;
      justify-content: center;
      background: #000;
    }

    .youtube-playlist-wrapper {
      width: 80%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
    }

    .youtube-playlist-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Social Footer - Bottom Center */
    .social-footer {
      width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 70px 20px 72px;
      background: #000;
      text-align: center;
    }

    .social-footer-text {
      text-align: center;
    }

    .social-footer-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    .social-footer-services {
      color: #fff;
      font-size: 12px;
      letter-spacing: 1.5px;
      line-height: 1.8;
      opacity: 0.9;
    }

    .social-footer-divider {
      width: 1px;
      height: 54px;
      background: #fff;
      opacity: 0.65;
      margin: 42px 0 34px;
    }

    .social-footer-contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .social-footer-subtitle {
      font-size: 13px;
      letter-spacing: 2px;
      opacity: 0.7;
      margin: 0 0 14px;
    }

    .social-overlay a {
      display: inline-flex;
      align-items: center;
      color: #b22222;
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .social-overlay a:hover {
      opacity: 1;
      transform: scale(1.06);
    }

    .social-overlay .icon {
      width: 24px;
      height: 24px;
      stroke: #b22222;
      fill: none;
      margin-right: 6px;
    }

    .social-overlay .email-text {
      cursor: pointer;
    }

    /* Logo overlay */
    .logo-overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10000;
      display: block;
    }
    .logo-overlay img {
      height: 120px;
      width: auto;
      display: block;
    }

    /* Local Videos Section */
    section.local-videos-section {
      height: auto;
      min-height: 0;
      display: flex;
      flex-wrap: wrap;
      width: 100vw;
      background: #000;
      overflow-x: hidden;
      gap: 4%;
      justify-content: space-between;
      padding: 20px 20px 20px 20px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .local-video-wrapper {
      flex: 0 0 48%;
      background: #000;
      overflow: hidden;
      position: relative;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .local-video-wrapper.grxmtheshit {
      height: calc(48vw * 0.727);
    }

    .local-video-wrapper.yazyenkilla {
      height: calc(48vw * 0.5625);
    }

    .local-video-wrapper.sidevideo {
      height: calc(48vw * 0.5625);
    }

    .local-video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      transition: transform 1.5s ease;
      display: block;
    }

    .local-video-wrapper:hover video {
      transform: scale(1.05);
    }

    /* Fullscreen Video Section (Saintmalayan) */
    section.new-video-section {
      position: relative;
      height: 100vh;
      padding: 0 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    section.new-video-section video {
      width: auto;
      max-width: 100%;
      height: 100%;
      max-height: 100vh;
      object-fit: contain;
      filter: brightness(0.85);
      transition: transform 1.5s ease;
      display: block;
    }

    section.new-video-section:hover video {
      transform: scale(1.05);
    }

    section.new-video-section .title {
      position: absolute;
      bottom: 40px;
      left: 40px;
      font-size: 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
      z-index: 10;
    }

    /* ========================================================= */
    /* MOBILE STYLES (ปรับปรุงใหม่ทั้งหมดเพื่อความสมดุลและกึ่งกลาง) */
    /* ========================================================= */
    @media (max-width: 768px) {
      section {
        height: auto;
        min-height: auto;
      }

      .video-wrapper {
        height: 60vh;
      }

      /* จัด Local Videos ให้เรียงลงมาทีละคลิป และอยู่กึ่งกลาง */
      section.local-videos-section {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 10px 16px;
        gap: 0;
      }

      .local-video-wrapper {
        flex: 0 0 100% !important;
        width: 100% !important;
        margin-bottom: 20px;
        height: auto !important;
      }

      /* ให้ Video ปรับความสูงตามอัตราส่วนจริงแบบไม่มีพื้นที่ว่างเกินไป */
      .local-video-wrapper video {
        width: 100%;
        height: auto;
        object-fit: cover;
      }

      /* Saintmalayan section บนมือถือ */
      section.new-video-section {
        height: auto;
        padding: 10px 16px;
        margin-bottom: 20px;
      }

      section.new-video-section video {
        width: 100%;
        height: auto;
        max-height: none;
      }

      /* Footer Elements */
      .social-footer {
        padding: 48px 16px 40px;
      }

      .social-footer-title {
        font-size: 16px;
        letter-spacing: 1.5px;
      }

      .social-footer-services {
        font-size: 11px;
        letter-spacing: 1px;
        line-height: 1.6;
      }

      .social-footer-divider {
        height: 36px;
        margin: 28px 0 24px;
      }

      .social-footer-subtitle {
        font-size: 11px;
        letter-spacing: 1.2px;
        margin-bottom: 12px;
      }

      .social-overlay {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .logo-overlay {
        top: 16px;
        left: 16px;
      }

      .logo-overlay img {
        height: 60px;
      }

      .youtube-playlist-wrapper {
        width: 100%;
        padding: 0 16px;
        box-sizing: border-box;
      }
    }
  </style>
